<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Candidate Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- Your original styling kept exactly same --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1553877522-43269d4ea984?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(106,95,253,0.1) 0%, rgba(255,215,0,0.05) 50%, transparent 70%);
            animation: rotate 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-container {
            width: 100%;
            max-width: 450px;            
            background: rgba(18, 18, 30, 0.85);
            backdrop-filter: blur(15px);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            text-align: center;
            margin-bottom: 25px;
        }

        .ai-avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6A5FFD, #8F79FF);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 20px rgba(106, 95, 253, 0.5);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .ai-avatar i {
            font-size: 35px;
            color: white;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #6A5FFD, #8F79FF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #b8b8d0;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #b8b8d0;
            transition: all 0.3s ease;
            z-index: 1;
            font-size: 18px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid rgba(106, 95, 253, 0.3);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: rgba(25, 25, 40, 0.8);
            color: #fff;
            font-weight: 500;
        }

        .error {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
            padding: 12px 16px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            border-left: 4px solid #e74c3c;
            font-weight: 500;
        }

        .forgot-password a {
            color: #6A5FFD;
        }

        button {
            padding: 16px;
            background: linear-gradient(135deg, #6A5FFD, #8F79FF);
            color: white;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .signup-btn {
            background: transparent;
            border: 2px solid #6A5FFD;
            color: #6A5FFD;
        }

    </style>
</head>

<body>

<div class="login-container">
    <div class="icon-wrapper">
        <div class="ai-avatar">
            <i class="fas fa-robot"></i>
        </div>
    </div>
    
    <h1>Welcome Back</h1>
    <div class="subtitle">Sign in to continue your AI interview journey</div>

    <!-- Error from Django backend -->
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="input-group">
            <input type="text" name="email" placeholder="Enter your email" required>
            <i class="fas fa-envelope"></i>
        </div>

        <div class="input-group">
            <input type="password" name="password" placeholder="Enter your password" required>
            <i class="fas fa-lock"></i>
        </div>

        <div class="forgot-password">
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">
            <i class="fas fa-sign-in-alt"></i>
            <span>Login</span>
        </button>

        <h3>or</h3>

        <button type="button" class="signup-btn">
            <a href="{% url 'signup_candidate' %}" style="color: inherit; text-decoration: none;">
                <i class="fas fa-user-plus"></i>
                <span>Create New Account</span>
            </a>
        </button>
    </form>
</div>

</body>
</html>
