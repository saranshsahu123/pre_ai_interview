<!DOCTYPE html>
<html>
<head>
    <title>Interview Question</title>
    <style>
        body{
            font-family: Arial;
            background:#eef1f7;
            margin:0;
        }
        .card{
            width:60%;
            background:#fff;
            margin:40px auto;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px #ccc;
        }
        textarea{
            width:100%;
            height:120px;
            padding:10px;
        }
        .btn{
            background:#0066ff;
            padding:10px 20px;
            color:white;
            border:none;
            border-radius:5px;
            margin-top:15px;
            cursor:pointer;
        }
        .btn:hover{background:#004dcc;}
        .feedback{
            background:#f7f7f7;
            padding:10px;
            margin-top:15px;
            border-left:5px solid #0066ff;
        }
    </style>
</head>

<body>

<div class="card">
    <h3>Question {{ index }} / {{ total }}</h3>
    <p><b>{{ question }}</b></p>

    <form method="POST">
        {% csrf_token %}
        <textarea name="answer" placeholder="Write your answer..."></textarea>

        <button class="btn" type="submit" name="action" value="submit">Submit</button>
        <button class="btn" style="background:#444" type="submit" name="action" value="next">Next</button>
    </form>

    {% if feedback %}
        <div class="feedback">
            <p><b>Feedback:</b> {{ feedback.feedback }}</p>
            <p><b>Ideal:</b> {{ feedback.ideal_answer }}</p>
            <p><b>English Score:</b> {{ feedback.english_score }}</p>
            <p><b>Communication:</b> {{ feedback.communication_score }}</p>
        </div>
    {% endif %}
</div>

</body>
</html>
