<!DOCTYPE html>
<html>
<head>
    <title>Interview Feedback</title>
    <style>
        body{
            font-family: Arial;
            background:#eef2f7;
            margin:0;
        }
        .card{
            width:450px;
            margin:80px auto;
            background:#fff;
            padding:25px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px #ccc;
        }
        h2{ margin-bottom:10px; }
        p{ font-size:16px; }
        .status{
            padding:10px;
            background:#0066ff;
            color:white;
            border-radius:5px;
            margin-top:20px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Interview Summary</h2>

    <p><b>Total Score:</b> {{ score }}</p>
    <p><b>Average English Score:</b> {{ english }}</p>
    <p><b>Communication Score:</b> {{ communication }}</p>

    <div class="status">{{ readiness }}</div>
</div>

</body>
</html>
