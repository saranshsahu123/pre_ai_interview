<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload Resume</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{
      margin:0;
      font-family:Inter,system-ui;
      background:linear-gradient(180deg,#eef2ff 0%,#f4f6fb 100%);
      padding:24px;
    }
    .wrap{
      max-width:600px;
      margin:50px auto;
      background:#fff;
      padding:24px 24px 26px;
      border-radius:18px;
      box-shadow:0 14px 45px rgba(15,23,42,0.18);
    }
    h1{
      margin:0 0 6px;
      font-size:22px;
      font-weight:800;
    }
    p{
      margin:0 0 16px;
      color:#6b7280;
      font-size:13px;
    }
    input[type=file]{
      margin:10px 0 16px;
    }
    button{
      padding:10px 16px;
      border-radius:999px;
      border:none;
      background:#4f46e5;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Upload Your Resume</h1>
  <p>Supported formats: PDF, DOCX. We will analyze your profile and generate an interview practice set.</p>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Analyze Resume</button>
  </form>
</div>
</body>
</html>
