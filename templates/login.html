<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{margin:0;font-family:Inter,system-ui;background:#f4f6fb;padding:24px;}
    .wrap{max-width:400px;margin:60px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 10px 30px rgba(15,23,42,0.15);}
    h1{margin:0 0 10px;font-size:20px;}
    label{display:block;font-size:13px;margin:8px 0 4px;}
    input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #d1d5db;}
    button{margin-top:14px;padding:10px 16px;border-radius:999px;border:none;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer;}
    .error{color:#b91c1c;font-size:13px;margin-bottom:8px;}
    a{font-size:13px;color:#4f46e5;text-decoration:none;}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Candidate Login</h1>
  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}
  {% for message in messages %}
    <div class="error">{{ message }}</div>
  {% endfor %}
  <form method="post">
    {% csrf_token %}
    <label>Email</label>
    <input type="email" name="email" required />
    <label>Password</label>
    <input type="password" name="password" required />
    <button type="submit">Login</button>
  </form>
  <p style="margin-top:10px;font-size:13px;">New here? <a href="{% url 'signup_candidate' %}">Create an account</a></p>
</div>
</body>
</html>
